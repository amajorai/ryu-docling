[project]
name = "ryu-docling-sidecar"
version = "0.1.0"
description = "Ryu's Core-managed Docling document-parsing sidecar (document.parse backend)"
# Docling itself requires 3.10+; the server half would run on 3.9, but declaring a
# floor the parser cannot meet would turn a clear install error into a runtime one.
requires-python = ">=3.10"
# Base server deps only. `docling` is an optional extra so this process boots and
# answers /health + /capability on any machine — that is how a user finds out the
# parser is not installed yet, instead of discovering it as a dead sidecar. A
# missing parse dep becomes a typed per-job error, never a boot crash.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# `pip install -e ".[parse]"` — the manifest's `pyproject_extra`. This pulls
# docling and, transitively, torch + the docling model wrappers: a multi-GB
# install. The layout and table-structure model *weights* are NOT in the wheel;
# they are fetched on the first parse. See README.md.
parse = ["docling>=2.0"]
# Tesseract as an alternative OCR engine. The Python binding is pip-installable
# but the `tesseract` binary and its language data are NOT — see README.md.
# Docling's default OCR engine (EasyOCR) needs no native binary at all, which is
# why this is opt-in rather than part of `parse`.
tesseract = ["docling>=2.0", "tesserocr>=2.6"]

[project.scripts]
ryu-docling = "ryu_docling.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ryu_docling"]
